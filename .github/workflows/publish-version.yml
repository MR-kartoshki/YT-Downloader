name: Publish Version Info

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v2.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Fetch release assets
        id: assets
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `${{ steps.version.outputs.tag }}`;
            const releaseResp = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag
            });

            const assets = (releaseResp.data.assets ?? []).map(a => ({
              name: a.name,
              url: a.browser_download_url
            }));

            core.setOutput('assets', JSON.stringify(assets));

      - name: Create version.json
        run: |
          cat > version.json << 'EOF'
          {
            "version": "${{ steps.version.outputs.version }}",
            "assets": ${{ steps.assets.outputs.assets }}
          }
          EOF
          cat version.json

      - name: Upload version.json to release
        uses: softprops/action-gh-release@v1
        with:
          files: version.json
          tag_name: ${{ steps.version.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
