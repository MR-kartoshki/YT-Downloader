name: Build Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build on Windows
      if: runner.os == 'Windows'
      run: python build.py

    - name: Build on macOS
      if: runner.os == 'macOS'
      run: python build.py

    - name: Build on Linux
      if: runner.os == 'Linux'
      run: python build.py

    - name: Upload Windows artifact
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: ytdownloader-windows
        path: dist/ytdownloader.exe

    - name: Package macOS app
      if: runner.os == 'macOS'
      run: |
        cd dist
        ditto -c -k --sequesterRsrc --keepParent "ytdownloader.app" "ytdownloader-macos.zip"
        cd ..

    - name: Upload macOS artifact
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: ytdownloader-macos
        path: dist/ytdownloader-macos.zip

    - name: Upload Linux artifact
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: ytdownloader-linux
        path: dist/ytdownloader

  create-release:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ytdownloader-windows/ytdownloader.exe
          ytdownloader-macos/ytdownloader-macos.zip
          ytdownloader-linux/ytdownloader
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ github.token }}
