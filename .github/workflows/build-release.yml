name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build
        run: python build.py

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "ytdownloader.app" "ytdownloader-macos.zip"

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ytdownloader-windows
          path: dist/ytdownloader.exe

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ytdownloader-macos
          path: dist/ytdownloader-macos.zip

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ytdownloader-linux
          path: dist/ytdownloader

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ytdownloader-windows/ytdownloader.exe
            ytdownloader-macos/ytdownloader-macos.zip
            ytdownloader-linux/ytdownloader
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build version.json
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          cat > version.json <<EOF
          {
            "version": "${VERSION}",
            "assets": [
              {"name": "ytdownloader.exe",       "url": "${BASE}/ytdownloader.exe"},
              {"name": "ytdownloader",            "url": "${BASE}/ytdownloader"},
              {"name": "ytdownloader-macos.zip",  "url": "${BASE}/ytdownloader-macos.zip"}
            ]
          }
          EOF
          cat version.json

      - name: Upload version.json to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: version.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
